<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco di prova vrm-assist-avatar-card</title>
<style>
  /* Variabili di tema simili a quelle di Home Assistant (tema scuro) */
  :root { --primary-color:#03a9f4; --text-primary-color:#fff; --primary-text-color:#e1e1e1;
          --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c; --divider-color:#333; }
  html, body { margin:0; height:100%; background:#111; color:#e1e1e1; font:14px sans-serif; }
  #ctl { position:fixed; top:6px; left:6px; z-index:10; display:flex; gap:4px; flex-wrap:wrap; }
  #ctl button { background:#222; color:#ddd; border:1px solid #444; border-radius:6px; padding:4px 8px; }
  #ctl button.on { background:#03a9f4; color:#fff; }
  body.shot #ctl { display:none; }
</style>
</head>
<body>
<div id="ctl"></div>
<script type="module">
  // Numeri casuali ripetibili (?seed=…), così gli screenshot sono confrontabili tra una versione e l'altra
  const q = new URLSearchParams(location.search);
  let seed = Number(q.get("seed") || 1) >>> 0;
  Math.random = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  await import("../dist/vrm-assist-avatar-card.js");

  // Parametri dall'indirizzo: ?state=listening&framing=bust&shot=1
  // Animazioni: &anim=riposo:clips/a.vrma|clips/b.fbx;parla:clips/c.fbx;spiritoso.gesti:clips/d.fbx (percorsi relativi a test/)
  const animations = {};
  for (const part of (q.get("anim") || "").split(";").filter(Boolean)) {
    // "stato:..." oppure "atteggiamento.stato:..." (es. serio.gesti:clips/a.fbx)
    const [key, list] = part.split(":"), [a, b] = key.split(".");
    if (b) (animations[a] = animations[a] || {})[b] = list.split("|"); else animations[a] = list.split("|");
  }
  const ENTITY = "assist_satellite.voice_pe";
  if (q.has("shot")) document.body.classList.add("shot");

  const card = document.createElement("vrm-assist-avatar-card");
  card.setConfig({
    model: q.get("model") || "clips/models/sample-vrm1.vrm",
    entity: ENTITY,
    framing: q.get("framing") || "bust",
    height: "100vh",
    demo: q.has("demo"),
    animations,
    personality: q.get("pers") || undefined,
    body: q.get("body") || undefined,
    theme: q.get("theme") || undefined,
  });

  // hass finto: basta l'oggetto states con lo stato del satellite
  const setState = s => {
    card.hass = { states: { [ENTITY]: { entity_id: ENTITY, state: s, attributes: {} } } };
    document.querySelectorAll("#ctl button").forEach(b => b.classList.toggle("on", b.dataset.s === s));
    window.__state = s;
  };
  window.setSatState = setState;

  const ctl = document.getElementById("ctl");
  for (const s of ["idle", "listening", "processing", "responding"]) {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.s = s; b.onclick = () => setState(s);
    ctl.appendChild(b);
  }
  setState(q.get("state") || "idle");
  document.body.appendChild(card);

  // Per lo script: segnala quando il modello è pronto
  const wait = setInterval(() => { if (card._animReady) { clearInterval(wait); card._animReady.then(() => { window.__ready = true; }); } }, 100);

  // Per lo script: ferma l'animazione in tempo reale e simula "sec" secondi a 30 fotogrammi al secondo,
  // poi disegna un solo fotogramma (il rendering software è troppo lento per andare in tempo reale)
  window.advance = sec => {
    card._renderer.setAnimationLoop(null);
    card._blink.next = Infinity; card._blink.t = -1; // occhi aperti nelle foto
    for (let i = 0; i < Math.round(sec * 30); i++) card._tick(1 / 30);
    card._renderer.render(card._scene, card._camera);
  };
  // Fa partire un gesto dell'atteggiamento corrente (per nome) che dura "dur" secondi; dir = lato (-1 o 1)
  window.gesture = (name, dur = 4, dir = 1) => {
    // gesti dell'atteggiamento per nome, oppure clip "gesti" per parte del nome del file (es. "yawn")
    const cg = card._clipGestures().find(c => c.name.includes(name));
    const g = cg || card.constructor.PERSONALITIES[card._persName].gestures.concat(card.constructor.CHEER).find(x => x.name === name);
    const clip = cg && cg.clip;
    if (clip) dur = clip.duration - 0.5;
    if (!g) throw new Error(`gesto ${name} non trovato`);
    Object.assign(card._idle, { g, t0: card._t, until: card._t + dur, next: card._t + dur + 100, dir });
  };
  // Posizione (in metri, coordinate del mondo) di un osso del modello
  window.bonePos = name => card._vrm.humanoid.getRawBoneNode(name).getWorldPosition(new card._THREE.Vector3());
  // Cerca i valori di posa (keys) che portano le ossa vicino agli obiettivi.
  // targets: [{ bone: "rightHand", pos: [x, y, z], w: 1 }]; start: valori di partenza; restituisce valori e posizioni ottenute
  window.solvePose = ({ keys, start = {}, targets, iters = 3000, restarts }) => {
    const P = card._P, V = (a) => new card._THREE.Vector3(...a);
    const tg = targets.map(t => ({ ...t, v: V(t.pos), w: t.w ?? 1 }));
    const cost = x => {
      keys.forEach((k, i) => P[k] = x[i]);
      card._tick(1e-6); card._vrm.scene.updateMatrixWorld(true);
      return tg.reduce((c, t) => c + t.w * bonePos(t.bone).distanceToSquared(t.v), 0);
    };
    // Discesa un valore alla volta; poi ripartenze da punti vicini scelti a caso, per non restare incastrati
    const descend = (x0) => {
      let best = x0, bc = cost(best), step = 0.4;
      for (let it = 0; it < iters && step > 0.002; it++) {
        let improved = false;
        for (let i = 0; i < keys.length; i++) for (const d of [step, -step]) {
          const x = best.slice(); x[i] += d; const c = cost(x);
          if (c < bc) { bc = c; best = x; improved = true; }
        }
        if (!improved) step *= 0.6;
      }
      return [best, bc];
    };
    // Durante la ricerca basta aggiornare lo scheletro (niente fisica di capelli e vestiti): molto più veloce
    const vrm = card._vrm, update = vrm.update;
    vrm.update = () => vrm.humanoid.update();
    let [best, bc] = descend(keys.map(k => start[k] ?? P[k]));
    for (let r = 0; r < (restarts ?? 12); r++) {
      const [x, c] = descend(best.map(v => v + (Math.random() - 0.5) * 0.8));
      if (c < bc) { best = x; bc = c; }
    }
    cost(best);
    vrm.update = update;
    const r = n => +n.toFixed(3);
    return { cost: r(bc), values: Object.fromEntries(keys.map((k, i) => [k, r(best[i])])),
      got: Object.fromEntries(tg.map(t => [t.bone, bonePos(t.bone).toArray().map(r)])) };
  };
  // Fotogramma corrente come immagine (subito dopo il disegno, quindi senza preserveDrawingBuffer)
  window.snap = () => { card._renderer.render(card._scene, card._camera); return card._renderer.domElement.toDataURL("image/png"); };
</script>
</body>
</html>
